[package]
name = "viam-rust-utils"
version = "0.6.2"
edition = "2021"
license = "Apache-2.0"
description = "Utilities designed for use with Viamrobotics's SDKs"
repository = "https://github.com/viamrobotics/rust-utils"
authors = ["Viam, inc. <contact@viam.com>"]

[lib]
crate-type = ["cdylib","lib","staticlib"]
# TODO(RSDK-4119): Enable doctests after getting autogenerated ones to compile.
doctest = false
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
dialdbg = []

[[bin]]
name = "viam-dialdbg"
path = "src/dialdbg/main.rs"
required-features = ["dialdbg"]

[dependencies]
anyhow = { version = "1.0", features = ["backtrace"]}
base64 = "0.13.0"
byteorder = "1.4.3"
bytes = "1.11.1"
chrono = "0.4.26"
clap = { version = "4.3.19", features = ["derive"] }
dashmap = "5.4.0"
derivative = "2.2.0"
ffi_helpers = "0.3.0"
float-cmp = "0.9.0"
futures = {version = "0.3", default-features = false, features = ["alloc", "executor"]}
futures-core = "0.3"
futures-util = "0.3"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http2", "server"] }
hyper-util = { version = "0.1.21", features = ["http2", "server", "server-graceful", "service", "tokio"] }
interceptor = "0.12.0"
libc = {version = "0.2"}
local-ip-address = "0.5.5"
log = "0.4.17"
log4rs = "1.2.0"
nalgebra = "0.31.4"
prost = "0.14.4"
prost-types = "0.14.4"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = {version = "1.19", features = ["rt-multi-thread", "time", "fs", "macros", "net"]}
tokio-stream = {version = "0.1", features = ["net"]}
tokio-util = "0.7"
tonic = {version = "0.14.9",features = [ "tls-ring", "gzip", "tls-native-roots","tls-webpki-roots"]}
tonic-prost = "0.14.9"
tower = { version = "0.5.3" }
tower-http = { version = "0.7.1", features = ["add-extension","auth","propagate-header","set-header","sensitive-headers","trace","compression-gzip"]}
tracing = {version = "0.1.34"}
tracing-subscriber = {version = "0.3.20", features = ["env-filter"]}
viam-mdns = "=3.0.1"
webrtc = "0.12.0"

[dev-dependencies]
async-stream = "0.3.3"
env_logger = "0.9.0"

[build-dependencies]
cbindgen = "0.29.2"
